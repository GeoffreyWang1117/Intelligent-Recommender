apiVersion: v1
kind: Secret
metadata:
  name: recommender-secrets
type: Opaque
stringData:
  # Redis Password (leave empty if no password)
  redis_password: ""

  # API Keys (for future authentication)
  api_key: "your-secret-api-key-here"

  # Database Credentials (if needed)
  # db_username: "recommender"
  # db_password: "your-db-password"

# Note: In production, use sealed-secrets or external secret management
# kubectl create secret generic recommender-secrets \
#   --from-literal=redis_password='your-redis-password' \
#   --from-literal=api_key='your-api-key'
