apiVersion: v1
kind: ConfigMap
metadata:
  name: recommender-config
data:
  # Redis Configuration
  redis_host: "redis"
  redis_port: "6379"
  redis_db: "0"

  # Application Configuration
  log_level: "INFO"
  default_top_k: "10"
  cache_ttl: "3600"

  # Model Configuration
  model_path: "/app/models/saved/"

  # API Configuration
  api_host: "0.0.0.0"
  api_port: "5000"
  max_workers: "4"
