[pytest]
# Pytest configuration for Intelligent Recommender System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable coverage reporting
    --cov=models
    --cov=services
    --cov=utils
    --cov=app
    # Coverage report options
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below threshold (can be adjusted)
    --cov-fail-under=50
    # Strict markers
    --strict-markers
    # Show warnings
    -W default
    # Capture output (use -s to disable)
    --capture=no
    # Continue on first failure (use -x to stop)
    --maxfail=5

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (test multiple components)
    slow: Slow running tests
    cache: Tests requiring Redis cache
    model: Model training and prediction tests
    api: API endpoint tests
    performance: Performance benchmarking tests

# Coverage options
[coverage:run]
source = models,services,utils,app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore errors
[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
